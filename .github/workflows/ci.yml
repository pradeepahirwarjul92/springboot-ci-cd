name: Spring Boot CI Pipeline

on: 
    push:
        branches: 
            - main

jobs:
    build:
        runs-on: ubuntu-latest
        
        steps:
            - name: Checkout Code
              uses: actions/Checkout@v4

            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                distribution: 'temurin'
                java-version: '17'
                
            - name: Build Project
              run: mvn clean install
              
            - name: Runn Test Cases
              run: mvn test 
            
            - name: Upload Jar
              uses: actions/upload-artifact@v4
              with:
                name: springboot-app
                path: target/*.jar  

            

